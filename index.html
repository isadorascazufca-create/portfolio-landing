<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isadora Scazufca | Portfolio</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #FAC600; /* Amarelo Tuim */
        }

        #pixelCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: crosshair;
        }

        /* O site fica ao fundo apenas para a "espiada" inicial */
        #portfolio-preview {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
            pointer-events: none; /* Bloqueia interação para forçar o redirecionamento */
        }
    </style>
</head>
<body>

    <iframe id="portfolio-preview" src="https://oiisadorascazufca.myportfolio.com/work"></iframe>
    <canvas id="pixelCanvas"></canvas>

    <script>
        const canvas = document.getElementById('pixelCanvas');
        const ctx = canvas.getContext('2d');
        const targetURL = "https://oiisadorascazufca.myportfolio.com/work";
        
        const cellSize = 80; 
        const pixelColor = '#FAC600';
        let pixels = [];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const cols = Math.ceil(canvas.width / cellSize);
            const rows = Math.ceil(canvas.height / cellSize);
            pixels = [];
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    pixels.push({ x: x * cellSize, y: y * cellSize, alive: true });
                }
            }
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = pixelColor;
            pixels.forEach(p => {
                if (p.alive) ctx.fillRect(p.x, p.y, cellSize, cellSize);
            });
        }

        function handleMove(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            let mudou = false;
            pixels.forEach(p => {
                if (p.alive && mouseX > p.x && mouseX < p.x + cellSize && mouseY > p.y && mouseY < p.y + cellSize) {
                    p.alive = false;
                    mudou = true;
                }
            });
            if (mudou) draw();
        }

        // A SOLUÇÃO: Redireciona a página para "libertar" o site do iframe
        function entrarNoSite() {
            window.top.location.href = targetURL;
        }

        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', (e) => handleMove(e.touches[0]), { passive: true });
        
        // Qualquer clique (ou toque) leva o usuário para o site real
        window.addEventListener('mousedown', entrarNoSite);
        window.addEventListener('touchstart', entrarNoSite);
        window.addEventListener('resize', init);

        init();
    </script>
</body>
</html>
