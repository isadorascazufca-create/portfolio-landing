<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isadora Scazufca | Portfolio</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #FAC600; /* Cor do seu estúdio Tuim */
        }

        #portfolio-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 5; /* O site fica no meio */
        }

        #pixelCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10; /* A máscara começa na frente */
            cursor: crosshair;
        }

        /* Esta classe é o segredo: ela torna o canvas invisível para o mouse */
        .pass-through {
            pointer-events: none !important;
            display: none !important;
        }
    </style>
</head>
<body>

    <iframe 
        id="portfolio-frame" 
        src="https://oiisadorascazufca.myportfolio.com/work"
        sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation allow-top-navigation-by-user-activation"
        allow="autoplay; encrypted-media; fullscreen">
    </iframe>

    <canvas id="pixelCanvas"></canvas>

    <script>
        const canvas = document.getElementById('pixelCanvas');
        const ctx = canvas.getContext('2d');
        const frame = document.getElementById('portfolio-frame');
        
        const cellSize = 80; 
        const pixelColor = '#FAC600';
        let pixels = [];
        let ativo = true;

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const cols = Math.ceil(canvas.width / cellSize);
            const rows = Math.ceil(canvas.height / cellSize);
            pixels = [];
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    pixels.push({ x: x * cellSize, y: y * cellSize, alive: true });
                }
            }
            draw();
        }

        function draw() {
            if (!ativo) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = pixelColor;
            pixels.forEach(p => {
                if (p.alive) ctx.fillRect(p.x, p.y, cellSize, cellSize);
            });
        }

        function handleMove(e) {
            if (!ativo) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            let mudou = false;
            pixels.forEach(p => {
                if (p.alive && mouseX > p.x && mouseX < p.x + cellSize && mouseY > p.y && mouseY < p.y + cellSize) {
                    p.alive = false;
                    mudou = true;
                }
            });
            if (mudou) draw();
        }

        // Nova lógica de revelação
        function revelarSite(e) {
            if (!ativo) return;
            
            // Torna o canvas "transparente" para cliques no exato momento do toque
            canvas.classList.add('pass-through');
            ativo = false;

            // Remove o canvas do sistema
            setTimeout(() => {
                canvas.remove();
            }, 10);
        }

        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', (e) => handleMove(e.touches[0]), { passive: true });
        
        // Usamos mousedown e pointerdown para máxima velocidade
        window.addEventListener('mousedown', revelarSite);
        window.addEventListener('pointerdown', revelarSite);
        window.addEventListener('resize', init);

        init();
    </script>
</body>
</html>
