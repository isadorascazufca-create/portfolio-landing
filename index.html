<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isadora Scazufca | Portfolio</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #FAC600; /* Seu amarelo hex */
        }

        #portfolio-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            /* Começa na camada 1 */
            z-index: 1; 
            display: block;
        }

        #pixelCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Começa na frente de tudo */
            z-index: 999; 
            cursor: crosshair;
            transition: opacity 0.5s ease;
        }

        /* Classe que será aplicada ao iframe após o clique */
        .site-ativo {
            z-index: 1000 !important;
        }
    </style>
</head>
<body>

    <iframe 
        id="portfolio-frame" 
        src="https://oiisadorascazufca.myportfolio.com/work"
        sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation allow-top-navigation-by-user-activation"
        allow="autoplay; encrypted-media; fullscreen">
    </iframe>

    <canvas id="pixelCanvas"></canvas>

    <script>
        const canvas = document.getElementById('pixelCanvas');
        const ctx = canvas.getContext('2d');
        const frame = document.getElementById('portfolio-frame');
        
        const cellSize = 80; // Quadrados grandes como você pediu
        const pixelColor = '#FAC600';
        let pixels = [];
        let ativo = true;

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const cols = Math.ceil(canvas.width / cellSize);
            const rows = Math.ceil(canvas.height / cellSize);
            pixels = [];
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    pixels.push({ x: x * cellSize, y: y * cellSize, alive: true });
                }
            }
            draw();
        }

        function draw() {
            if (!ativo) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = pixelColor;
            pixels.forEach(p => {
                if (p.alive) ctx.fillRect(p.x, p.y, cellSize, cellSize);
            });
        }

        function handleMove(e) {
            if (!ativo) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            let mudou = false;
            pixels.forEach(p => {
                if (p.alive && mouseX > p.x && mouseX < p.x + cellSize && mouseY > p.y && mouseY < p.y + cellSize) {
                    p.alive = false;
                    mudou = true;
                }
            });
            if (mudou) draw();
        }

        function revelarSite() {
            if (!ativo) return;
            ativo = false;
            
            // 1. Faz o canvas sumir
            canvas.style.opacity = '0';

            // 2. A MÁGICA: Joga o site para a frente de tudo (z-index 1000)
            frame.classList.add('site-ativo');
            
            // 3. Remove o canvas de vez para não ter erro
            setTimeout(() => {
                canvas.remove();
                frame.focus();
            }, 550);
        }

        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', (e) => handleMove(e.touches[0]), { passive: true });
        
        // O clique que libera o site
        window.addEventListener('click', revelarSite);
        window.addEventListener('resize', init);

        init();
    </script>
</body>
</html>
